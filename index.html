<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6e1f3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ahadu">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <title>ለአሃዱ | For Ahadu</title>
</head>
<body>
  <header class="top">
    <span class="brand" id="brand"></span>
    <button id="langBtn" class="lang" type="button"></button>
  </header>

  <main>
    <section class="hero">
      <img src="wedding.svg" alt="" width="600" height="420">
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
    </section>

    <section class="verse">
      <h2 id="verseTitle"></h2>
      <blockquote id="verseText"></blockquote>
      <p class="ref" id="verseRef"></p>
      <button id="nextVerse" type="button" class="soft"></button>
    </section>

    <section class="days">
      <h2 id="daysTitle"></h2>
      <p class="big" id="daysNum"></p>
      <p class="detail" id="daysDetail"></p>
    </section>

    <section>
      <h2 id="lettersTitle"></h2>
      <div id="letters"></div>
    </section>

    <section class="reasons">
      <h2 id="reasonsTitle"></h2>
      <p class="reason" id="reasonText"></p>
      <button id="nextReason" type="button" class="soft"></button>
    </section>

    <section class="prayer">
      <h2 id="prayerTitle"></h2>
      <p id="prayerText"></p>
    </section>

    <section>
      <h2 id="storyTitle"></h2>
      <ol class="timeline" id="timeline"></ol>
    </section>
  </main>

  <footer id="footer"></footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
